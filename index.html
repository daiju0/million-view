<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>最新レート & ニュース</title>
  <style>
    body { font-family: sans-serif; padding: 40px; }
    h1 { font-size: 28px; margin-bottom: 24px; }
    .block { margin-bottom: 40px; }
  </style>
</head>
<body>

  <h1>最新レート & ニュース</h1>

  <div class="block">
    <h2>USD/JPY 為替レート</h2>
    <p id="rate">読み込み中…</p>
  </div>

  <div class="block">
    <h2>最新ニュース</h2>
    <ul id="news">読み込み中…</ul>
  </div>

<script>
async function loadRate() {
  try {
    const res = await fetch("/functions/forex");
    const data = await res.json();
    document.getElementById("rate").textContent =
      `${data.price} 円`;
  } catch {
    document.getElementById("rate").textContent =
      "取得できませんでした";
  }
}

async function loadNews() {
  try {
    const res = await fetch("/functions/news");
    const data = await res.json();
    document.getElementById("news").innerHTML =
      data.news.map(n => `<li>${n}</li>`).join("");
  } catch {
    document.getElementById("news").textContent =
      "ニュースを取得できませんでした";
  }
}

loadRate();
loadNews();
</script>

</body>
</html>
