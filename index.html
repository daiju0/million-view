<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>最新レート & ニュース</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
    }
    h1 { font-size: 32px; margin-bottom: 10px; }
    h2 { margin-top: 40px; }
    .rate-box {
      font-size: 28px;
      font-weight: bold;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 8px;
      margin-top: 10px;
      display: inline-block;
    }
    ul { padding-left: 16px; }
    li { margin-bottom: 12px; }
    a { text-decoration: none; color: #0066ff; }
  </style>
</head>

<body>

  <h1>最新レート & ニュース</h1>

  <!-- ✅ 為替レート表示 -->
  <h2>USD/JPY 為替レート</h2>
  <div id="forex" class="rate-box">読み込み中...</div>

  <!-- ✅ ニュース表示 -->
  <h2>最新ニュース</h2>
  <ul id="news-list"></ul>

  <!-- ✅ JavaScript 読み込み -->
  <script src="forex.js"></script>
  <script src="news.js"></script>

</body>
</html>
