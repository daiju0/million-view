<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>最新レート & ニュース</title>

  <script>
    async function loadForex() {
      try {
        const res = await fetch("/functions/forex");
        const data = await res.json();
        document.getElementById("forex").textContent =
          `USD/JPY: ${data.price} 円`;
      } catch {
        document.getElementById("forex").textContent =
          "取得できませんでした";
      }
    }

    async function loadNews() {
      try {
        const res = await fetch("/functions/news");
        const data = await res.json();

        const list = document.getElementById("news");
        list.innerHTML = "";

        data.articles.forEach(item => {
          const div = document.createElement("div");
          div.innerHTML = `<a href="${item.link}" target="_blank">${item.title}</a>`;
          list.appendChild(div);
        });

      } catch {
        document.getElementById("news").innerHTML =
          "ニュースを取得できませんでした";
      }
    }

    loadForex();
    loadNews();
  </script>
</head>

<body>
  <h1>最新レート & ニュース</h1>
  <div id="forex">読み込み中…</div>

  <h2>最新ニュース</h2>
  <div id="news">読み込み中…</div>
</body>
</html>
