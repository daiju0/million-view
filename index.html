<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>最新レート & ニュース</title>
</head>
<body>
    <h1>最新レート & ニュース</h1>

    <h2>USD/JPY レート</h2>
    <div id="rate">読み込み中...</div>

    <h2>最新ニュース</h2>
    <div id="news">読み込み中...</div>

<script>
async function loadData() {
    try {
        // ★ 為替
        const rateRes = await fetch("https://open.er-api.com/v6/latest/JPY");
        const rateData = await rateRes.json();
        const usdJpy = (1 / rateData.rates.USD).toFixed(2);
        document.getElementById("rate").textContent =
            `${usdJpy} 円`;

       // ★ ニュース（確実版）
const newsRes = await fetch(
  "https://api.currentsapi.services/v1/latest-news?language=jp&apiKey=demo"
);
const newsJson = await newsRes.json();

if (newsJson.news && newsJson.news.length > 0) {
  document.getElementById("news").innerHTML =
    newsJson.news.slice(0, 5).map(n => `・${n.title}`).join("<br>");
} else {
  document.getElementById("news").textContent =
    "ニュースを取得できませんでした";
}


    } catch (e) {
        document.getElementById("rate").textContent =
            "取得できませんでした";
        document.getElementById("news").textContent =
            "ニュースを取得できませんでした";
    }
}

loadData();
</script>
</body>
</html>
