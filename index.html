<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>最新レート & ニュース</title>
</head>
<body>
    <h1>最新レート & ニュース</h1>

    <h2>USD/JPY レート</h2>
    <div id="rate">読み込み中...</div>

    <h2>最新ニュース</h2>
    <div id="news">読み込み中...</div>

<script>
  async function loadData() {
    try {
      // レート
      const rateRes = await fetch("https://api.exchangerate-api.com/v4/latest/JPY");
      const rateData = await rateRes.json();
      document.getElementById("rate").textContent =
        `${rateData.rates.USD} 円`;

      // ニュース（外部APIに変更済み）
      const newsRes = await fetch("https://newsdata.io/api/1/news?apikey=pub_33809d72518c24d049930f1c409827ee73689&q=Japan");
      const newsData = await newsRes.json();

      if (newsData.results && newsData.results.length > 0) {
        document.getElementById("news").innerHTML =
          newsData.results.map(i => `・${i.title}`).join("<br>");
      } else {
        document.getElementById("news").textContent =
          "ニュース取得できませんでした";
      }

    } catch (err) {
      document.getElementById("news").textContent =
        "ニュース取得できませんでした";
    }
  }

  loadData();
</script>

</body>
</html>
