<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>最新レート & ニュース</title>
  <style>
    body { font-family: sans-serif; padding: 40px; }
    h1 { font-size: 32px; margin-bottom: 20px; }
    .section { margin-bottom: 40px; }
  </style>
</head>
<body>

  <h1>最新レート & ニュース</h1>

  <div class="section">
    <h2>USD/JPY 為替レート</h2>
    <p id="rate">読み込み中…</p>
  </div>

  <div class="section">
    <h2>最新ニュース</h2>
    <ul id="news">読み込み中…</ul>
  </div>

<script>
async function loadRate() {
  try {
    const res = await fetch("/functions/forex");
    const data = await res.json();
    document.getElementById("rate").textContent =
      data.price ? `${data.price} 円` : "取得できませんでした";
  } catch {
    document.getElementById("rate").textContent = "取得できませんでした";
  }
}

async function loadNews() {
  try {
    const res = await fetch("/functions/news");
    const data = await res.json();
    const list = document.getElementById("news");

    if (!data.news || data.news.length === 0) {
      list.textContent = "ニュースを取得できませんでした";
      return;
    }

    list.innerHTML = data.news
      .map(item => `<li>${item}</li>`)
      .join("");
  } catch {
    document.getElementById("news").textContent =
      "ニュースを取得できませんでした";
  }
}

loadRate();
loadNews();
</script>

</body>
</html>
