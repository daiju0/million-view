<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>最新レート & ニュース</title>

  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 30px; }
    h1 { font-size: 28px; margin-bottom: 20px; }
    #forex { font-size: 26px; font-weight: bold; margin-bottom: 40px; }
    .news-item { margin: 12px 0; font-size: 18px; }
    a { color: #0078ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>

  <script>
    async function loadForex() {
      try {
        const res = await fetch("/forex");
        const data = await res.json();
        document.getElementById("forex").textContent =
          `USD/JPY: ${data.price} 円`;
      } catch {
        document.getElementById("forex").textContent =
          "取得できませんでした";
      }
    }

    async function loadNews() {
      try {
        const res = await fetch("/news");
        const data = await res.json();

        const list = document.getElementById("news");
        list.innerHTML = "";

        data.articles.forEach(item => {
          const div = document.createElement("div");
          div.className = "news-item";
          div.innerHTML = `<a href="${item.link}" target="_blank">${item.title}</a>`;
          list.appendChild(div);
        });

      } catch {
        document.getElementById("news").innerHTML =
          "ニュースを取得できませんでした";
      }
    }

    loadForex();
    loadNews();

    setInterval(loadForex, 600000);
    setInterval(loadNews, 600000);
  </script>
</head>

<body>
  <h1>最新レート & ニュース</h1>
  <div id="forex">読み込み中…</div>

  <h2>最新ニュース（自動更新）</h2>
  <div id="news">読み込み中…</div>
</body>
</html>
