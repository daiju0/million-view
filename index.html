<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>最新レート & ニュース</title>
</head>
<body>
    <h1>最新レート & ニュース</h1>

    <h2>USD/JPY レート</h2>
    <div id="rate">読み込み中...</div>

    <h2>最新ニュース</h2>
    <div id="news">読み込み中...</div>

<script>
async function loadData() {
    try {
        // ★ 為替
        const rateRes = await fetch("https://open.er-api.com/v6/latest/JPY");
        const rateData = await rateRes.json();
        const usdJpy = (1 / rateData.rates.USD).toFixed(2);
        document.getElementById("rate").textContent =
            `${usdJpy} 円`;

        // ★ ニュース
        const newsRes = await fetch("https://newsdata.io/api/1/news?apikey=pub_24422f5bb4c51cd7216e3eb8cb0942859ed1&q=tokyo&language=ja");
        const newsData = await newsRes.json();

        if (newsData.results && newsData.results.length > 0) {
            document.getElementById("news").innerHTML =
                newsData.results.map(i => `${i.title}`).join("<br>");
        } else {
            document.getElementById("news").textContent =
                "ニュースを取得できませんでした";
        }

    } catch (e) {
        document.getElementById("rate").textContent =
            "取得できませんでした";
        document.getElementById("news").textContent =
            "ニュースを取得できませんでした";
    }
}

loadData();
</script>
</body>
</html>
