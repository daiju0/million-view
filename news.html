<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>世界ニュース速報</title>
  <style>
    body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
    h1 { font-size: 28px; }
    .item { margin-bottom: 18px; }
    .item a { font-size: 20px; font-weight: bold; color: #000; text-decoration: none; }
    .item a:hover { text-decoration: underline; }
    .time { font-size: 14px; color: #555; }
  </style>
</head>
<body>

<h1>🌎 世界ニュース速報</h1>
<div id="news">読み込み中...</div>

<script>
async function loadNews() {
  try {
    const res = await fetch("https://newsdata.io/api/1/news?country=jp&category=world&language=ja");
    const data = await res.json();

    const items = data.results.slice(0, 10); // 最新10件

    document.getElementById("news").innerHTML =
      items.map(n => `
        <div class="item">
          <a href="${n.link}" target="_blank">${n.title}</a>
          <div class="time">${n.pubDate}</div>
        </div>
      `).join("");
  } catch (e) {
    document.getElementById("news").textContent = "取得できませんでした";
  }
}

loadNews();
setInterval(loadNews, 600000); // 10分ごとに更新
</script>

</body>
</html>
